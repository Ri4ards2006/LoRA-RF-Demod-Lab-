; =============================================================================
; PlatformIO Configuration for ESP32 LoRa & Baseband Stimulus Generator
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = default, time

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D SYNC_PIN=26
    -D STIMULUS_PIN=25
    -D LORA_SS=18
    -D LORA_RST=14
    -D LORA_DIO0=27

lib_deps =
    sandeepmistry/LoRa@^0.8.0

